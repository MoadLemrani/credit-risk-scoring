name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (trains a small model on a 3k-row sample, then exercises the API)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train the production model
        run: python -m creditrisk.train --no-mlflow
      - name: Build image
        run: docker build -t credit-risk-api .
      - name: Smoke-test the container
        run: |
          docker run -d -p 8000:8000 --name api credit-risk-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/health
